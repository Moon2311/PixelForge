# Optional production reverse proxy (not used by docker-compose.yml).
# Every /api/* path is served by the single Django backend; nginx only
# terminates HTTP and serves uploaded media.
upstream pixelforge_backend {
    server backend:8000;
}

server {
    listen 80;
    client_max_body_size 25m;

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://pixelforge_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
