# Stable endpoints in front of the Patroni cluster (docker-compose.ha.yml).
#
#   :5000  writer  -> the one node whose Patroni API says it is the primary
#   :5001  reader  -> healthy replicas, round robin per connection
#   :8008  Patroni REST API of any live member (cluster status, history)
#   :8404  HAProxy stats page
#
# Every server starts fully down and takes traffic only after `rise` passing
# checks, so a freshly (re)started HAProxy never routes writes to a standby
# or reads to the primary before it knows who is who.
#
# Nodes are discovered through Docker DNS: every PostgreSQL container has the
# network alias "pgnode", so replacement nodes join the endpoints without a
# config change. Health checks ask each node's Patroni API, not PostgreSQL:
# only Patroni knows who holds the leader key in etcd.

global
    maxconn 1000

defaults
    mode tcp
    timeout connect 3s
    timeout client 30m
    timeout server 30m
    timeout check 2s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold other 5s
    hold refused 5s
    hold nx 5s
    hold timeout 5s
    hold obsolete 5s
    accepted_payload_size 8192

listen stats
    mode http
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s

listen writer
    bind *:5000
    option httpchk
    http-check send meth GET uri /primary
    http-check expect status 200
    # A node that stops being primary is dropped at once and its client
    # connections are cut, so no session keeps writing to a demoted node.
    default-server init-state fully-down inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server-template slot 1-8 pgnode:5432 check port 8008 resolvers docker init-addr none

listen reader
    bind *:5001
    balance roundrobin
    option httpchk
    # Running replica, at most 1 MB of WAL behind (Patroni's view).
    http-check send meth GET uri /replica?lag=1MB
    http-check expect status 200
    default-server init-state fully-down inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server-template slot 1-8 pgnode:5432 check port 8008 resolvers docker init-addr none

listen patroni_api
    mode http
    bind *:8008
    option httpchk
    http-check send meth GET uri /liveness
    http-check expect status 200
    default-server init-state fully-down inter 2s fall 2 rise 2
    server-template slot 1-8 pgnode:8008 check resolvers docker init-addr none
